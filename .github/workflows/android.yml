name: Build Nexora APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Inject Gemini API key
        run: |
          sed -i "s#YAHAN_APNI_API_KEY_DALO#${{ secrets.GEMINI_API_KEY }}#" app/src/main/assets/index.html

      - name: Build APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: app/build/outputs/apk/debug/*.apk
