<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora AI</title>
<style>
  body { margin:0; font-family: sans-serif; background:#0f0f14; color:#eee; display:flex; flex-direction:column; height:100vh; }
  #header { padding:14px; background:#1a1a22; font-size:18px; font-weight:bold; text-align:center; }
  #messages { flex:1; overflow-y:auto; padding:12px; }
  .msg { max-width:80%; margin:6px 0; padding:10px 14px; border-radius:14px; line-height:1.4; word-wrap:break-word; }
  .user { background:#3b82f6; color:white; margin-left:auto; }
  .bot { background:#242430; color:#eee; margin-right:auto; }
  #inputBar { display:flex; padding:10px; background:#1a1a22; }
  #userInput { flex:1; padding:10px; border-radius:20px; border:none; background:#2a2a35; color:white; }
  #sendBtn { margin-left:8px; padding:10px 18px; border-radius:20px; border:none; background:#3b82f6; color:white; }
</style>
</head>
<body>
  <div id="header">Nexora AI</div>
  <div id="messages"></div>
  <div id="inputBar">
    <input id="userInput" placeholder="Message likho..." />
    <button id="sendBtn">Send</button>
  </div>

<script>
const GEMINI_API_KEY = "YAHAN_APNI_API_KEY_DALO";
const MODEL = "gemini-2.5-flash";
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";
  addMessage("...", "bot");

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: text }] }]
        })
      }
    );
    const data = await res.json();
    messagesDiv.removeChild(messagesDiv.lastChild);

    if (data.error) {
      addMessage("API ERROR: " + data.error.message, "bot");
    } else if (data.candidates && data.candidates[0] && data.candidates[0].content) {
      addMessage(data.candidates[0].content.parts[0].text, "bot");
    } else {
      addMessage("Unexpected response: " + JSON.stringify(data), "bot");
    }
  } catch (e) {
    messagesDiv.removeChild(messagesDiv.lastChild);
    addMessage("Network error: " + e.message, "bot");
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
